<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="title desc"><title id="title">Operator signal relationships</title><desc id="desc">Top: operator one goes to output. Bottom: operator two modulates operator one, which goes to output.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="#55751c"/></marker></defs><rect width="760" height="240" rx="8" fill="#dfe6d3"/><g fill="#f5f6ef" stroke="#819268" stroke-width="1.5"><rect x="285" y="25" width="150" height="64" rx="6"/><rect x="55" y="145" width="150" height="64" rx="6"/><rect x="285" y="145" width="150" height="64" rx="6"/><rect x="560" y="25" width="145" height="64" rx="6"/><rect x="560" y="145" width="145" height="64" rx="6"/></g><g stroke="#55751c" stroke-width="2" marker-end="url(#a)"><path d="M435 57h115"/><path d="M205 177h70"/><path d="M435 177h115"/></g><g font-family="sans-serif" font-size="19" text-anchor="middle" fill="#283a18"><text x="360" y="64">OP 1</text><text x="130" y="184">OP 2</text><text x="360" y="184">OP 1</text><text x="632" y="64">OUT</text><text x="632" y="184">OUT</text></g><g font-family="sans-serif" font-size="14" fill="#5d7046"><text x="55" y="63">01</text><text x="18" y="183">02</text><text x="220" y="137">FM</text></g></svg>
