<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="title desc"><title id="title">ADSR</title><desc id="desc">A rises to the peak, D falls to S, which is held until key release. R falls to zero afterwards.</desc><rect width="760" height="310" rx="8" fill="#dfe6d3"/><g stroke="#b8c4a7" stroke-width="1"><path d="M50 48v194h660M175 55v187M310 55v187M510 55v187"/><path d="M50 130h660" stroke-dasharray="5 6"/></g><path d="M50 242 175 65 310 130H510Q585 219 710 242Z" fill="#9fb95a" opacity=".25"/><path d="M50 242 175 65 310 130H510Q585 219 710 242" fill="none" stroke="#466811" stroke-width="4"/><g fill="#f5f6ef" stroke="#466811" stroke-width="3"><circle cx="175" cy="65" r="7"/><circle cx="310" cy="130" r="7"/><circle cx="710" cy="242" r="7"/></g><g font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2e4615"><text x="111" y="40">A</text><text x="245" y="40">D</text><text x="410" y="110">S</text><text x="610" y="40">R</text></g><g stroke="#6e8054" stroke-width="2"><path d="M50 272h460"/><path d="M50 266v12M510 266v12"/></g><g font-family="sans-serif" font-size="15" fill="#486132"><text x="55" y="298">KEY ↓</text><text x="489" y="298">KEY ↑</text><text x="28" y="52">+</text></g></svg>
