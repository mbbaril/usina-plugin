<figure class="patch-map"><figcaption><strong>AUX: um envio que se soma de volta</strong><span>Mapa funcional. PRE e POST são alternativas.</span></figcaption><div class="flow-line"><div class="flow-node"><small>FONTE PRE</small><strong>Antes de A/B</strong></div><span class="flow-arrow" aria-hidden="true">→</span><div class="flow-node"><strong>FX A / FX B</strong><span>Roteamento escolhido</span></div><span class="flow-arrow" aria-hidden="true">→</span><div class="flow-node"><small>FONTE POST</small><strong>Depois de A/B</strong></div></div><div class="aux-branch"><div class="flow-node"><strong>PRE ou POST</strong><span>Seleção do envio</span></div><span class="flow-arrow" aria-hidden="true">→</span><div class="flow-node accent-node"><strong>SEND</strong><span>Entrada no AUX</span></div><span class="flow-arrow" aria-hidden="true">→</span><div class="flow-node"><strong>Slots AUX</strong><span>Processamento</span></div><span class="flow-arrow" aria-hidden="true">→</span><div class="flow-node accent-node"><strong>RETURN</strong><span>Soma após A/B</span></div></div><p>O sinal principal segue seu caminho. O AUX acrescenta a contribuição processada; RETURN em 0 dB não significa silêncio.</p></figure>
