<div class="visual-pair">
<figure class="explain-card"><figcaption><b>1. Em cadeia</b><span>Uma transformação alimenta a seguinte.</span></figcaption><img src="assets/algo-chain.svg" alt="OP3 modula OP2, OP2 modula OP1 e somente OP1 vai à saída."/><p>OP3 afeta a transformação feita por OP2; o resultado chega a OP1. Ajustar um bloco acima pode mudar o comportamento de toda a cadeia.</p></figure>
<figure class="explain-card"><figcaption><b>2. Em paralelo</b><span>Duas saídas chegam ao resultado.</span></figcaption><img src="assets/algo-parallel.svg" alt="OP2 alimenta OP1; OP1 e OP3 têm saída direta e são somados."/><p>OP1 recebe OP2. OP3 tem saída própria. Você pode equilibrar as duas contribuições sem que OP3 precise modular OP1.</p></figure>
</div>
<div class="experiment"><span class="experiment-tag">COMPARE UM GESTO</span><p><strong>Modulador:</strong> mova LEVEL de OP2. <strong>Saída direta:</strong> mova LEVEL de OP1. Compare o que muda na estrutura do som e o que muda em sua presença. Os dois efeitos podem se misturar conforme o patch.</p></div>
