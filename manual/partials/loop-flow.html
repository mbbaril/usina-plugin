<figure class="patch-map"><figcaption><strong>LOOP INSERT: a cópia que retorna</strong><span>Caminho direto e memória do laço são separados.</span></figcaption><div class="flow-line"><div class="flow-node"><strong>Soma do sinal</strong><span>Vozes/FX, AUX, entrada e retorno</span></div><span class="flow-arrow" aria-hidden="true">→</span><div class="flow-node accent-node"><strong>LEVEL</strong><span>Tomada para o laço depois daqui</span></div><span class="flow-arrow" aria-hidden="true">→</span><div class="flow-node"><strong>Guarda → saída</strong><span>Caminho ouvido diretamente</span></div></div><div class="loop-stages"><div><b>1 · Cópia antes da guarda</b><span>O sinal já passou por LEVEL.</span></div><div><b>2 · LOOP INSERT</b><span>Os slots transformam a cópia.</span></div><div><b>3 · Memória / TIME</b><span>Material guardado e lido com atraso.</span></div><div><b>4 · FEEDBACK e proteções</b><span>O retorno é limitado e volta à soma do sinal.</span></div></div><p>↶ O retorno volta à soma. Não atravessa automaticamente FX A/B ou AUX em cada volta.</p></figure>
